name: Validate Ansible files
permissions: {}

'on':
  push:
    branches:
      - main
  pull_request:

jobs:
  ansible:
    name: Validate Ansible files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Ansible
        run: |
          pip install ansible
      - name: Install ansible-lint
        run: |
          pip install ansible-lint
      - name: Validate Ansible files
        run: |
          make check
