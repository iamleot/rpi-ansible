---
- name: Configure RPI4
  hosts: all

  vars:
    # List of channels with latest versions is available at
    # <https://update.k3s.io/v1-release/channels>.
    k3s_version: v1.33.13+k3s1

  roles:
    - role: packages
    - role: network
    - role: dns_resolver
    - role: wireguard
    - role: k3s
