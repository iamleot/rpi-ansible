---
#
# Setup network
#

- name: Set hostname.
  become: true
  ansible.builtin.copy:
    src: hostname
    dest: /etc/hostname
    owner: root
    group: root
    mode: '0644'
- name: Setup network by populating `/etc/network`.
  become: true
  ansible.builtin.copy:
    src: eth0
    dest: /etc/network/interfaces.d/eth0
    owner: root
    group: root
    mode: '0644'
